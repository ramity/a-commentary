events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # 1. High-Speed Static Serving directly from shared volume
        # Requests to /posts/{id}.html or /posts/{id} served directly from disk
        location /posts/ {
            alias /usr/share/nginx/html/posts/;
            try_files $uri $uri.html =404;
            expires 1m;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
            add_header X-Served-By "Nginx-Static-Disk";
        }

        # 2. Reverse Proxy to C# .NET 8 Web API
        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # Swagger endpoint proxy (useful for API exploration)
        location /swagger/ {
            proxy_pass http://backend:5000/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 3. Vue 3 SPA Frontend static bundle
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
