events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name localhost;

        # 1. High-Speed Static Serving directly from shared volume
        location /posts/ {
            alias /usr/share/nginx/html/posts/;
            try_files $uri $uri.html =404;
            add_header X-Served-By "Nginx-Static-Disk";
        }

        # 2. Reverse Proxy to C# .NET 8 Web API
        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger API documentation
        location /swagger/ {
            proxy_pass http://backend:5000/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 3. Proxy to Vite Dev Server with WebSocket HMR support
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
